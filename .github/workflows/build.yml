name: Build WHALE

# Builds ready-to-install files:
#   macOS   : WHALE-<version>-macOS.pkg          (VST3 + AU, Apple Silicon + Intel)
#   Windows : WHALE-<version>-Windows-Setup.exe  (VST3, 64-bit)
# plus plain zips, after running the offline tests and pluginval.
# Download them from the "Artifacts" section of the run, or from the "installers-whale" branch.

on:
  push:
    branches: [ main, master, whale ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  VERSION: 1.2.0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Sources live in a neutral folder: Windows refuses paths ending with "." (repository name "finish.").
        working-directory: ${{ matrix.src }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            src: 'C:/wsrc'
          - name: macOS
            os: macos-15-intel          # arm64 runners were not available (capacity); the build is universal anyway
            src: src

    steps:
      - name: Get sources (Windows)
        if: runner.os == 'Windows'
        working-directory: 'C:/'
        shell: bash
        run: git clone --depth 1 --branch "${{ github.head_ref || github.ref_name }}" "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /c/wsrc

      - uses: actions/checkout@v4
        if: runner.os != 'Windows'
        with:
          path: src

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWHALE_BUILD_TESTS=ON

      - name: Build plugin and tests
        run: cmake --build build --config Release --parallel 4 --target WHALE_All WhaleTests

      # Failures are also posted as annotations (visible in the run summary without downloading the logs).
      - name: Run offline tests
        shell: bash
        run: |
          exe=build/WhaleTests_artefacts/Release/WhaleTests; [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          set +e; "$exe" > tests.log 2>&1; code=$?; set -e
          cat tests.log
          if [ $code -ne 0 ]; then
            grep "FAIL" tests.log | head -20 | while IFS= read -r l; do echo "::error title=Test ($RUNNER_OS)::$l"; done
            tail -n 12 tests.log | while IFS= read -r l; do echo "::warning title=Test log end ($RUNNER_OS)::$l"; done
            exit $code
          fi

      # Licence activation path against the real Gumroad API (fake key -> "does not exist"). Informative only.
      - name: Check Gumroad licence API
        continue-on-error: true
        shell: bash
        run: |
          exe=build/WhaleTests_artefacts/Release/WhaleTests; [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          set +e; out=$("$exe" --licence-online 2>&1); code=$?; set -e
          echo "$out"; echo "::notice title=Gumroad API ($RUNNER_OS)::$out"
          exit $code

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - build/WHALE_artefacts/Release/VST3/WHALE.vst3
          codesign --force --deep --sign - build/WHALE_artefacts/Release/AU/WHALE.component

      - name: Validate with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          7z x pluginval.zip -opluginval > /dev/null
          ./pluginval/pluginval.exe --strictness-level 10 --skip-gui-tests --validate-in-process --validate "build/WHALE_artefacts/Release/VST3/WHALE.vst3"

      - name: Validate with pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip -d pluginval
          ./pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --skip-gui-tests --validate-in-process --validate build/WHALE_artefacts/Release/VST3/WHALE.vst3

      # ---------------- macOS installer (.pkg) ----------------
      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: |
          set -e
          mkdir -p pkg/vst3 pkg/au dist
          cp -R build/WHALE_artefacts/Release/VST3/WHALE.vst3 pkg/vst3/
          cp -R build/WHALE_artefacts/Release/AU/WHALE.component pkg/au/
          for kind in vst3 au; do
            pkgbuild --analyze --root pkg/$kind pkg/$kind.plist
            plutil -replace 0.BundleIsRelocatable -bool NO pkg/$kind.plist
          done
          pkgbuild --root pkg/vst3 --component-plist pkg/vst3.plist --install-location "/Library/Audio/Plug-Ins/VST3" \
                   --identifier com.whaleaudio.whale.vst3 --version "$VERSION" pkg/WHALE-VST3.pkg
          pkgbuild --root pkg/au --component-plist pkg/au.plist --install-location "/Library/Audio/Plug-Ins/Components" \
                   --identifier com.whaleaudio.whale.au --version "$VERSION" pkg/WHALE-AU.pkg
          productbuild --package pkg/WHALE-VST3.pkg --package pkg/WHALE-AU.pkg "dist/WHALE-$VERSION-macOS.pkg"
          mkdir zipdir
          cp -R build/WHALE_artefacts/Release/VST3/WHALE.vst3 build/WHALE_artefacts/Release/AU/WHALE.component INSTALL_EN.txt INSTALL_FR.txt zipdir/
          (cd zipdir && zip -qry "../dist/WHALE-$VERSION-macOS-VST3-AU.zip" .)

      # ---------------- Windows installer (.exe) ----------------
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc "/DAppVersion=$env:VERSION" "/O$PWD\dist" Installer\WHALE.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force -Path zipdir | Out-Null
          Copy-Item -Recurse build/WHALE_artefacts/Release/VST3/WHALE.vst3 zipdir/
          Copy-Item INSTALL_EN.txt, INSTALL_FR.txt zipdir/
          Compress-Archive -Path zipdir/* -DestinationPath "dist/WHALE-$env:VERSION-Windows-VST3.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: WHALE-${{ matrix.name }}
          path: ${{ matrix.src }}/dist/*

  # Also store the installers on the "installers-whale" branch (FINISH keeps "installers").
  publish:
    needs: build
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Push installers branch
        run: |
          mkdir out
          find artifacts -type f \( -name '*.pkg' -o -name '*.exe' -o -name '*.zip' \) -exec cp {} out/ \;
          ls -la out
          cd out
          git init -q
          git checkout -q -b installers-whale
          git add .
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "WHALE installers for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" installers-whale

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
